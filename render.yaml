services:
  - type: web
    name: reto-factus-backend
    runtime: node
    plan: free
    rootDir: backend
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /_health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_CLIENT
        value: sqlite
      - key: DATABASE_FILENAME
        value: .tmp/data.db
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: FACTUS_URL
        sync: false
      - key: FACTUS_CLIENT_ID
        sync: false
      - key: FACTUS_CLIENT_SECRET
        sync: false
      - key: FACTUS_USERNAME
        sync: false
      - key: FACTUS_PASSWORD
        sync: false
      - key: FACTUS_API_KEY
        sync: false
      - key: FACTUS_DEBUG
        value: "false"
